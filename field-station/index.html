<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Station · Digital Live Zoo</title>
<meta name="description" content="Bilingual (English & Russian) 360° VR wildlife camps with Studio ElevenLabs narration: spot elephants, giraffes and clues from sunrise to sunset in Kids and Adults editions, then check live animal cams.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://digitallivezoo.com/field-station/">
<meta property="og:title" content="Field Station · Digital Live Zoo (EN / RU)">
<meta property="og:description" content="Embedded 360° VR wildlife camps on site (no YouTube redirect): sunrise-to-sunset safari quests for Kids and Adults in English & Russian with Studio ElevenLabs narration.">
<meta property="og:image" content="https://digitallivezoo.com/field-station/img/safari-camp.jpg">
<meta property="og:url" content="https://digitallivezoo.com/field-station/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b120e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Oswald:wght@700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<style>
/* Field Station: the zoo's dark night-green world for the scenes, and a paper field journal beside them.
   One deliberate look (like the rest of the site), so no light/dark switch. */
:root{
  --bg:#0b120e; --panel:#121d17; --panel-2:#18261e; --line:#24362b;
  --fg:#e7eee4; --muted:#93a598; --faint:#5e7163;
  --sign:#f2c230; --live:#ff4a3d; --day:#9fd36b; --night:#7aa2ff;
  --paper:#f1f0e6; --paper-line:#dcdccb; --ink:#1d2a20; --ink-soft:#56614f; --mark:#c7392e;
  --display:"Big Shoulders Stencil Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Figtree","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html.fslock,html.fslock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
.bar .home{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.bar .home:hover{color:var(--fg)}
.word{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;color:var(--sign);margin-right:auto}
.sw-group{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.mode button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--sign);color:#1d2a20}
.mode-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* station home */
.home-v{display:grid;gap:40px;padding-block:30px 60px}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px 40px;align-items:end}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,8.2vw,104px);line-height:.88;margin:0;text-transform:uppercase;color:var(--sign)}
.hero p{margin:12px 0 0;color:var(--muted);max-width:60ch;font-size:16px}
.passport{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px 18px;display:grid;gap:10px;background-image:linear-gradient(var(--paper-line) 1px,transparent 1px);background-size:100% 26px}
.pp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pp-top b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.pp-top span{font-family:var(--hand);font-size:22px;color:var(--mark)}
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.stamps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stamp{aspect-ratio:1;max-width:100%;border:2px dashed var(--paper-line);border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:8px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);padding:5px;line-height:1.15;overflow-wrap:anywhere}
.stamp.got{border:3px solid var(--mark);color:var(--mark);transform:rotate(-8deg);font-weight:500;background:rgba(199,57,46,.06)}
.stamp.got small{display:block;font-size:7px;margin-top:2px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0;text-transform:uppercase}
.sec-h span{color:var(--muted);font-size:14px}
.exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ex{display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0}
.ex.featured{border-color:rgba(242,194,48,.55);box-shadow:0 0 0 1px rgba(242,194,48,.18)}
.ex .th{position:relative;aspect-ratio:2/1;max-width:100%;background:var(--panel-2)}
.ex .th img{width:100%;height:100%;object-fit:cover;display:block}
.ex .th.night{background:radial-gradient(circle at 72% 32%,#f1f0e6 0 9px,rgba(241,240,230,.25) 10px,transparent 26px),radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 52%,#fff,transparent),radial-gradient(1px 1px at 85% 70%,#fff,transparent),radial-gradient(1px 1px at 12% 72%,#fff,transparent),linear-gradient(180deg,#0a1530,#132a20)}
.ex .tag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(11,18,14,.84);border-radius:999px;padding:3px 9px}
.ex .vrtag{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sign);color:#1d2a20;border-radius:999px;padding:3px 8px}
.ex .bd{display:grid;gap:6px;padding:14px 16px 16px;align-content:start}
.ex h3{margin:0;font-family:var(--display);font-weight:800;font-size:27px;line-height:1.03;text-transform:uppercase}
.ex p{margin:0;color:var(--muted);font-size:14px}
.ex .go{margin-top:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sign)}
button.ex{cursor:pointer;transition:border-color .15s,transform .15s}
button.ex:hover{border-color:var(--sign);transform:translateY(-2px)}
.ex.soon{opacity:.62}
.ex.soon .go{color:var(--faint)}
.credits{font-size:12.5px;color:var(--faint);max-width:86ch}
.credits a{color:var(--muted)}

/* expedition run */
.run-v{display:grid;gap:14px;padding-block:16px 40px}
.run-h{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.run-h h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;text-transform:uppercase;margin-right:auto}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--day)}
.dots i.now{background:var(--sign)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 395px;gap:16px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.view{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
@media (max-width:620px){.view{aspect-ratio:4/5;border-radius:14px}}
#pano,.yt,#ytBox,#liveEmbed{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Embedded On-Site WebGL 360° VR Camp Player (DLZ360Player) */
.dlz360-wrap{position:absolute;inset:0;width:100%;height:100%;background:#060b08;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;outline:none}
.dlz360-wrap.dlz360-cssfull{position:fixed;inset:0;z-index:50;border-radius:0}
.dlz360-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.dlz360-canvas:active{cursor:grabbing}
.dlz360-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:.45}
.dlz360-pins{position:absolute;inset:0;pointer-events:none;z-index:3}
.dlz360-pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;padding:0}
.dlz360-overlay{position:absolute;inset:0;pointer-events:none;z-index:4}
.dlz360-top{position:absolute;left:10px;right:10px;top:10px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none;transition:opacity .35s}
.dlz360-compass{background:rgba(11,18,14,.78);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--sign)}
.dlz360-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dlz360-badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:rgba(11,18,14,.82);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 9px;color:var(--fg)}
.dlz360-live-pill{background:rgba(242,194,48,.92);color:#1d2a20;border-color:var(--sign);font-weight:700}
.dlz360-ed-pill{color:var(--day);border-color:rgba(159,211,107,.45)}
.dlz360-bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:grid;justify-items:center;gap:5px;text-align:center;background:rgba(11,18,14,.88);border:2px solid var(--sign);border-radius:18px;padding:16px 22px;color:var(--fg);max-width:min(380px,calc(100% - 28px));box-shadow:0 16px 40px rgba(0,0,0,.6)}
.dlz360-bigplay:hover{background:#121d17;transform:translate(-50%,-50%) scale(1.02)}
.dlz360-bigplay-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sign);color:#1d2a20;font-size:20px;font-weight:800}
.dlz360-bigplay b{font-family:var(--display);font-size:24px;letter-spacing:.03em;text-transform:uppercase;color:var(--sign);line-height:1.05}
.dlz360-bigplay small{font-size:12.5px;color:var(--muted);line-height:1.35}
.dlz360-bot{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;gap:6px;padding:24px 10px 10px;background:linear-gradient(to top,rgba(6,11,8,.92),rgba(6,11,8,.55) 62%,transparent);transition:opacity .35s}
.dlz360-chapters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dlz360-chapters::-webkit-scrollbar{display:none}
.dlz360-chap{flex:0 0 auto;border:1px solid rgba(255,255,255,.22);background:rgba(11,18,14,.78);color:var(--muted);border-radius:999px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.dlz360-chap:hover{color:var(--fg);border-color:rgba(255,255,255,.5)}
.dlz360-chap.active{background:var(--sign);color:#1d2a20;border-color:var(--sign);font-weight:700}
.dlz360-scrub-row{display:flex;align-items:center}
.dlz360-scrub{width:100%;accent-color:var(--sign);height:5px;cursor:pointer;margin:0}
.dlz360-ctrl-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dlz360-spacer{flex:1 1 auto}
.dlz360-btn{border:1px solid rgba(255,255,255,.24);background:rgba(11,18,14,.8);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;line-height:1.2}
.dlz360-btn:hover{border-color:var(--sign)}
.dlz360-btn[aria-pressed="true"]{background:var(--sign);color:#1d2a20;border-color:var(--sign)}
.dlz360-lang{border-color:rgba(242,194,48,.5);color:var(--sign)}
.dlz360-time{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-inline:4px}
.dlz360-full.dlz360-idle .dlz360-bot,.dlz360-full.dlz360-idle .dlz360-top{opacity:0;pointer-events:none}
.lens-toggle{position:absolute;left:10px;top:44px;z-index:6;border:1px solid rgba(255,255,255,.25);background:rgba(11,18,14,.78);color:var(--fg);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em}
.lens-toggle:hover{border-color:var(--sign)}

/* binocular lens: darkened edges, a focus ring in the middle that fills while you hold steady */
.lens{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 33%,rgba(0,0,0,.18) 45%,rgba(0,0,0,.62) 70%)}
.ring{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2}
.ring .fg{fill:none;stroke:var(--sign);stroke-width:5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240}
.ring::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.8)}
.aim{position:absolute;left:50%;top:calc(50% + 52px);transform:translateX(-50%);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;background:rgba(11,18,14,.82);border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.arrow{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.arrow span{position:absolute;left:-14px;top:-114px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--sign);color:#1d2a20;font-weight:800;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.found-pin{width:22px;height:22px;border-radius:50%;border:3px solid var(--sign);background:rgba(242,194,48,.28);box-shadow:0 0 0 3px rgba(0,0,0,.4)}
.look{position:absolute;right:10px;bottom:56px;display:grid;grid-template-columns:repeat(4,auto);gap:6px;z-index:3}
.look button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(11,18,14,.75);color:#fff;font-size:14px}
.look .tilt{grid-column:1/-1;width:auto;border-radius:999px;font-weight:700;font-size:13px}
.appbtn{position:absolute;left:10px;right:10px;top:10px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sign);color:#1d2a20;text-decoration:none;border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.appbtn b{font-size:14.5px;display:block}
.appbtn span{font-size:12px;line-height:1.35;display:block}
.appbtn button{background:#1d2a20;color:var(--paper);border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px}
.view .credit{position:absolute;right:10px;bottom:10px;font-size:11px;color:#dfe6dc;background:rgba(11,18,14,.7);border-radius:6px;padding:3px 8px;max-width:70%}
.view .credit a{color:#fff}
.livebox{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#1d3024,#0b120e 70%)}
.livebox .lt{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--live);display:inline-flex;gap:8px;align-items:center}
.livebox .lt i{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(255,74,61,.6);animation:ping 1.8s ease-out infinite}
@keyframes ping{100%{box-shadow:0 0 0 14px rgba(255,74,61,0)}}
.livebox h3{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.8vw,54px);line-height:.98;margin:8px 0 6px;text-transform:uppercase}
.livebox .clock{font-family:var(--mono);font-size:clamp(40px,6vw,64px);color:var(--sign);line-height:1}
.livebox .sub{color:var(--muted);margin-top:8px;max-width:52ch}
.livebox .sunrow{font-family:var(--mono);font-size:12px;color:var(--day);margin-top:6px}
.livebox .watchhere{margin-top:14px;border:1px solid var(--sign);background:rgba(242,194,48,.14);color:var(--sign);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px}
.livebox .watchhere:hover{background:var(--sign);color:#1d2a20}

/* the field journal */
.journal{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px 18px 20px;display:grid;gap:13px;background-image:linear-gradient(var(--paper-line) 1px,transparent 1px);background-size:100% 28px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.j-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.journal h3{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;color:var(--ink)}
.j-intro{margin:0;font-size:14.5px}
.wx-box{border:1.5px dashed var(--ink-soft);border-radius:10px;padding:8px 11px;background:rgba(29,42,32,.04);font-size:12.5px;display:grid;gap:2px}
.wx-box b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.wx-box span{color:var(--ink-soft)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.tasks li::before{content:"";width:16px;height:16px;margin-top:3px;border:2px solid var(--ink-soft);border-radius:4px}
.tasks li.ok::before{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.tasks li.ok{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--mark)}
.tasks li.cur{font-weight:700}
.card{border:2px solid var(--ink);border-radius:12px;padding:11px 13px;background:var(--paper);display:grid;gap:5px;position:relative}
.card b{font-size:15px;padding-right:64px}
.card p{margin:0;font-size:14px}
.card .sci{font-style:italic;color:var(--ink-soft);font-size:12.5px}
.card .hand{position:absolute;right:12px;top:6px;font-family:var(--hand);font-size:23px;color:var(--mark);transform:rotate(-6deg)}
.q{display:grid;gap:7px}
.q > b{font-size:14.5px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13.5px}
.opts button:hover{background:rgba(29,42,32,.06)}
.opts button.right{background:#dfeccf;border-color:#3f7a22}
.opts button.wrong{background:#f4d9d4;border-color:var(--mark);text-decoration:line-through}
.opts button:disabled{cursor:default}
.fb{margin:0;font-size:13.5px}
.fb .hand{font-family:var(--hand);font-size:21px;color:var(--mark);margin-right:4px}
.j-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.main{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.why{font-size:12.5px;color:var(--ink-soft)}
.hintb{border:0;background:transparent;color:var(--ink-soft);text-decoration:underline;font-size:13px;padding:0;justify-self:start}
.done-box{display:grid;gap:10px;justify-items:start}
.big-stamp{width:154px;height:154px;border:4px solid var(--mark);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--mark);font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;transform:rotate(-10deg);padding:14px;overflow-wrap:anywhere;animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}

  // ---------- solar, sunrise/sunset & MET Norway weather helper ----------
  function solarTelemetry(slug, tz){
    const s = S();
    const W = window.ZooWx, now = new Date();
    const fmt = d => d.toLocaleTimeString("en-GB", {timeZone: tz, hour: "2-digit", minute: "2-digit"});
    const time = fmt(now);
    let night = null, phase = "day", riseStr = "", setStr = "", wx = "", hud = "";
    const r = W && W.at(slug);
    if(r && r.place){
      const sun = W.sun(r.place.lat, r.place.lon, now);
      if(sun.rise && sun.set){
        riseStr = fmt(sun.rise);
        setStr = fmt(sun.set);
        night = !(now >= sun.rise && now < sun.set);
        const minsFromRise = (now - sun.rise) / 60000;
        const minsToSet = (sun.set - now) / 60000;
        if(Math.abs(minsFromRise) <= 55) phase = "sunrise";
        else if(Math.abs(minsToSet) <= 55) phase = "sunset";
        else phase = night ? "night" : "day";
      } else if(sun.polar){
        night = sun.polar === "night";
        phase = night ? "night" : "day";
      }
      if(r.w && r.d){
        const skyTxt = lang === "ru" ? (WX_RU[r.d.text] || r.d.text) : r.d.text;
        let windTxt = W.wind(r.w.ws);
        if(lang === "ru") windTxt = windTxt.replace("km/h", "км/ч").replace("mph", "миль/ч");
        wx = `${r.d.icon} ${skyTxt} · ${W.temp(r.w.t, true)} · ${s.windWord} ${windTxt}`;
        hud = `${time} ${s.localWord} · ${r.d.icon} ${W.temp(r.w.t, false)}`;
      }
    }
    if(night === null){
      const h = +time.slice(0, 2);
      night = h < 6 || h >= 19;
      phase = (h >= 5 && h <= 7) ? "sunrise" : (h >= 17 && h < 19) ? "sunset" : (night ? "night" : "day");
    }
    if(!hud) hud = `${time} ${s.localWord} · ${night ? s.hudNight : s.hudDay}`;
    return {time, night, phase, phaseLoc: s.phases[phase] || phase, riseStr, setStr, wx, hud};
  }

  // ---------- stop type 1: spot it in a 360° photo (Pannellum) ----------
  const R2D = 180 / Math.PI;
  function angDist(y1, p1, y2, p2){
    const r = Math.PI / 180, c = Math.sin(p1*r)*Math.sin(p2*r) + Math.cos(p1*r)*Math.cos(p2*r)*Math.cos((y1 - y2)*r);
    return Math.acos(Math.max(-1, Math.min(1, c))) * R2D;
  }
  function buildSpot(s){
    $("view").innerHTML = `<div id="pano"></div><div class="lens"></div>
      <div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="bgc" cx="42" cy="42" r="38"/><circle class="fg" id="ringFg" cx="42" cy="42" r="38"/></svg></div>
      <div class="arrow" id="arrow" hidden><span>↑</span></div><div class="aim" id="aim">${esc(S().lookAround)}</div>
      <div class="credit">${esc(S().photo360Credit)} ${s.credit}</div>`;
    viewer = pannellum.viewer("pano", {type:"equirectangular", panorama:s.pano, autoLoad:true, yaw:s.yaw, pitch:s.pitch, hfov:95,
      minHfov:40, maxHfov:110, showFullscreenCtrl:true, showZoomCtrl:true, compass:false, keyboardZoom:true, mouseZoom:true, friction:0.2});
    s.targets.forEach(t => { if(run.found[t.id]) pin(t); });
    let holdId = null, holdStart = 0;
    const C = 2 * Math.PI * 38;
    const step = () => {
      loop = requestAnimationFrame(step);
      if(!viewer || !viewer.isLoaded || !viewer.isLoaded()) return;
      const ui = S();
      const y = viewer.getYaw(), p = viewer.getPitch();
      const open = s.targets.filter(t => !run.found[t.id]);
      let near = null, nd = 999;
      open.forEach(t => { const d = angDist(y, p, t.yaw, t.pitch); if(d < nd){ nd = d; near = t; } });
      const fg = $("ringFg"), aim = $("aim"), arrow = $("arrow");
      if(!fg) return;
      if(near && nd < near.tol){
        if(holdId !== near.id){ holdId = near.id; holdStart = performance.now(); }
        const k = Math.min(1, (performance.now() - holdStart) / 1100);
        fg.style.strokeDashoffset = String(C * (1 - k));
        aim.textContent = k < 1 ? ui.holdSteady : ui.logged;
        if(k >= 1){ found(s, near); holdId = null; }
      } else {
        holdId = null; fg.style.strokeDashoffset = String(C);
        if(!(+aim.dataset.until > Date.now())) aim.textContent = open.length ? (mode === "junior" ? ui.tapOrHoldJr : ui.tapOrHoldPro) : ui.allFound;
      }
      if(open.length && (mode === "junior" || run.hint) && nd >= (near ? near.tol : 0)){
        let dy = ((near.yaw - y + 540) % 360) - 180, dp = near.pitch - p;
        const ang = Math.atan2(dy, dp) * R2D;
        arrow.hidden = false; arrow.style.transform = `rotate(${ang}deg)`;
      } else arrow.hidden = true;
    };
    loop = requestAnimationFrame(step);
    const pano = $("pano"); let down = null;
    pano.addEventListener("pointerdown", e => { down = {x: e.clientX, y: e.clientY, t: Date.now()}; });
    pano.addEventListener("pointerup", e => {
      if(!down || !viewer) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = Date.now() - down.t < 600;
      down = null;
      if(moved > 10 || !quick || e.target.closest(".pnlm-controls-container")) return;
      let c; try{ c = viewer.mouseEventToCoords(e); }catch(err){ return; }
      const ui = S();
      const open = s.targets.filter(t => !run.found[t.id]);
      let best = null, bd = 999;
      open.forEach(t => { const d = angDist(c[1], c[0], t.yaw, t.pitch); if(d < bd){ bd = d; best = t; } });
      if(best && bd < best.tol * 1.6){ found(s, best); flash(ui.foundFlash(R(best.name))); }
      else flash(open.length ? ui.nothingThere : ui.foundEverythingHere);
    });
  }
  function flash(msg){
    const a = $("aim"); if(!a) return;
    a.textContent = msg; a.dataset.until = String(Date.now() + 1800);
  }
  function pin(t){
    try{ viewer.addHotSpot({id:t.id, pitch:t.pitch, yaw:t.yaw, cssClass:"found-pin", createTooltipFunc:(div) => { div.title = R(t.name); },
      clickHandlerFunc:() => { run.last = t.id; journalSpot(run.x.stops[run.i]); }}); }catch(e){}

  function found(s, t){

        if(near && nd < near.tol){

        } else {
          holdId = null; fg.style.strokeDashoffset = String(C);
          if(!(+aim.dataset.until > Date.now())){
            aim.textContent = open.length
              ? (mode === "junior" ? ui.drag360Jr : ui.drag360Pro)
              : ui.all360Logged;
          }
        }
        if(open.length && (mode === "junior" || run.hint) && nd >= (near ? near.tol : 0)){
          let dy = ((near.yaw - y + 540) % 360) - 180, dp = near.pitch - p;
          const ang = Math.atan2(dy, dp) * R2D;

        <div class="ring" id="campRing"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="bgc" cx="42" cy="42" r="38"/><circle class="fg" id="ringFg" cx="42" cy="42" r="38"/></svg></div>

      <h3>${esc(cleanLiveHeading(s))}</h3>
      <div class="clock" id="lvClock">${esc(st.time)}</div>
      <div class="sub" id="lvSub">${esc(R(s.place))} · ${st.night ? ui.nightWord : ui.dayWord}${st.wx ? " · " + esc(st.wx) : ""}</div>
      ${sunInfo}
      <button type="button" class="watchhere" id="watchLiveInline">${esc(ui.watchLiveHere)}</button>
    </div></div>`;
    $("watchLiveInline").addEventListener("click", () => {
      const vid = run.liveId || s.fallbackId;
      $("view").innerHTML = `<iframe id="liveEmbed" src="https://www.youtube.com/embed/${encodeURIComponent(vid)}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(R(s.title))}"></iframe>`;
      track("fs_live_inline", {slug: s.slug, id: vid, mode, lang});
    });
    clearInterval(liveTick);
    liveTick = setInterval(() => { const c = $("lvClock"); if(!c){ clearInterval(liveTick); return; } c.textContent = solarTelemetry(s.slug, s.tz).time; }, 20000);
    run.liveId = s.fallbackId;
    fetch("/slugs.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : null).then(m => {
      if(!m) return; const id = Object.keys(m).find(k => m[k] === s.slug); if(id){ run.liveId = id; const a = $("liveLink"); if(a) a.href = "/#" + id; }
    }).catch(() => {});
    if(window.ZooWx) ZooWx.ready.then(() => {
      if(run && run.x.stops[run.i] === s){
        updateLiveBoxLocale(s);
        journalLive(s);
      }
    });
  }
  function journalLive(s){
    const ui = S();
    const st = solarTelemetry(s.slug, s.tz);
    const placeName = R(s.place);
    const defaultDayOpt = lang === "ru"
      ? "Дикие лошади Намиба, ориксы или страусы у поилки"
      : "Wild horses, oryx or ostriches coming to drink";
    const defaultNightOpt = lang === "ru"
      ? "Пятнистые гиены или чепрачные шакалы у воды"
      : "Spotted hyenas or jackals checking the water";
    const dayOpt = s.speciesDay ? R(s.speciesDay) : defaultDayOpt;
    const nightOpt = s.speciesNight ? R(s.speciesNight) : defaultNightOpt;
    const dayFact = s.factDay || {
      en:{
        junior:"The famous wild horses of the Namib drink here, and so do oryx (gemsbok) and ostriches. They can go a long time without water, but they come back to this trough again and again.",
        pro:"The feral horses of Garub, descended from horses left in the area in the early 1900s, depend on this trough; gemsbok (oryx) and ostriches use it too. Visits cluster in the cooler morning and late afternoon."
      },
      ru:{
        junior:"Сюда приходят пить знаменитые дикие лошади пустыни Намиб, длиннорогие ориксы и страусы! В пустыне мало воды, поэтому все они возвращаются к этому источнику.",
        pro:"Одичавшие лошади Гаруба, живущие в Намибе с начала XX века, зависят от этого источника наряду с сернобыками-ориксами и страусами; пик посещений приходится на утро и предзакатные часы."
      }
    };
    const nightFact = s.factNight || {
      en:{
        junior:"Hyenas and jackals are night hunters. At Garub they even wait near the water for the wild horses. Look for glowing eyes on the night camera!",
        pro:"Spotted hyenas are the main nocturnal visitors at Garub and a known predator of the feral horses' foals; black-backed jackals scavenge around the trough. The infrared camera shows them as pale shapes with bright eyeshine."
      },
      ru:{
        junior:"Гиены и шакалы — ночные охотники! В Гарубе они часто проверяют воду в темноте. Ищите светящиеся глаза на ночной камере!",
        pro:"Пятнистые гиены и чепрачные шакалы — главные ночные посетители Гаруба; инфракрасная подсветка камеры показывает их светлыми силуэтами с ярким отблеском глаз."
      }
    };
    const q = st.night
      ? {q:{
           en:{junior:`It is ${st.time} and dark at ${placeName}. Who is most likely on the live camera right now?`, pro:`Local time ${st.time} (after ${st.setStr || "sunset"}). Which visitors does this live cam most likely show?`},
           ru:{junior:`Сейчас ${st.time}, в районе «${placeName}» темно. Кого вероятнее всего увидеть на живой камере?`, pro:`Местное время ${st.time} (после заката ${st.setStr || ""}). Какие виды наиболее вероятны в ночном эфире?`}
         },
         opts: lang === "ru"
           ? ["Никого: ночью абсолютно все звери спят", nightOpt, "Белых медведей и пингвинов"]
           : ["Nobody: every animal sleeps all night", nightOpt, "Polar bears and penguins"],
         a:1, fact:nightFact}
      : {q:{
           en:{junior:`It is ${st.time} and daytime at ${placeName}. Who is most likely visiting right now?`, pro:`Local time ${st.time} (between ${st.riseStr || "sunrise"} and ${st.setStr || "sunset"}). Which diurnal visitors are expected?`},
           ru:{junior:`Сейчас ${st.time}, в районе «${placeName}» светлый день. Кто скорее всего подходит к воде?`, pro:`Местное время ${st.time} (между рассветом ${st.riseStr || ""} и закатом ${st.setStr || ""}). Какие дневные посетители ожидаемы?`}
         },
         opts: lang === "ru"
           ? ["Пингвины на льдинах", dayOpt, "Никого: днём к воде никто никогда не подходит"]
           : ["Penguins on sea ice", dayOpt, "Nobody: waterholes stay empty all day"],
         a:1, fact:dayFact};
    run.liveA = q.a;
    const got = run.answered["live:" + run.i + ":" + mode];
    const bt = q.opts.map((o, j) => {
      const cls = got === undefined ? "" : (j === q.a ? "right" : (j === got ? "wrong" : ""));
      return `<button type="button" data-q="0" data-o="${j}" class="${cls}" ${got !== undefined ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("");
    const fb = got === undefined ? "" : `<p class="fb"><span class="hand">${esc(got === q.a ? ui.handYes : ui.handNo)}</span>${esc(R(q.fact))}</p>`;
    const link = `/#${run.liveId || s.fallbackId}`;
    $("journal").innerHTML = `<p class="j-k">${esc(ui.stopWord(run.i + 1))} · ${esc(ui.liveCamMeta)} · ${esc(placeName)}</p><h3>${esc(R(s.title))}</h3>
      <p class="j-intro">${esc(R(s.intro))}</p>
      <div class="q"><b>${esc(R(q.q))}</b><div class="opts">${bt}</div>${fb}</div>
      ${got !== undefined ? `<div class="j-actions"><a class="btn" id="liveLink" href="${link}" target="_blank" rel="noopener">${esc(ui.openMainStage)}</a></div>` : ""}
      ${nextBtn(got !== undefined, ui.predictLiveWhy)}`;
  }

  renderChrome();
  renderHome();
})();
</script>
</body>
</html>
