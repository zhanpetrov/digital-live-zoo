name: Cam activity

# Scores how worth watching every cam is right now (picture, movement, live viewers, viewer spikes)
# so the Main Stage tour goes where something is happening. See tools/activity.py.
on:
  schedule:
    - cron: "13,43 * * * *"   # off the top of the hour, when GitHub drops the most scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy onnxruntime
      - uses: actions/cache@v4
        with:
          path: .model
          key: clip-vit-b32-vision-quantized-v1
      - name: Download CLIP image model (first run only)
        run: |
          mkdir -p .model
          [ -s .model/clip_vision.onnx ] || curl -sSfL -o .model/clip_vision.onnx \
            https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: activity-state-${{ github.run_id }}
          restore-keys: activity-state-
      - name: Score cams
        run: |
          set -o pipefail
          python tools/activity.py catalog.json activity.json .state .model/clip_vision.onnx 2> err.txt | tee out.txt || {
            echo "::error title=activity.py failed::$(tail -c 1500 err.txt | tr '\n' '|')"; exit 1; }
          echo "::notice title=Activity::$(head -1 out.txt)"
      - uses: actions/cache/save@v4
        with:
          path: .state
          key: activity-state-${{ github.run_id }}
      - name: Publish activity.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json
          git commit -q -m "Update cam activity" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
